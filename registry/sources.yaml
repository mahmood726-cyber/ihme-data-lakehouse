# IHME Data Lakehouse — Download Registry
# Each domain lists known download URLs from GHDx (ghdx.healthdata.org).
# sha256: null means checksum will be populated after first download.
# requires_auth: true means user must download manually and place in data/raw/{domain}/.

gbd_results:
  description: "GBD 2021 cause-level results (deaths, DALYs, YLLs, YLDs, prevalence, incidence)"
  manual_fallback: true
  files:
    - name: "IHME-GBD_2021_DATA-death-dalys.zip"
      url: "https://ghdx.healthdata.org/sites/default/files/record-attached-files/IHME-GBD_2021_DATA-death-dalys.zip"
      sha256: null
      requires_auth: false
      size_hint: "1.8GB"
    - name: "IHME-GBD_2021_DATA-prevalence-incidence.zip"
      url: "https://ghdx.healthdata.org/sites/default/files/record-attached-files/IHME-GBD_2021_DATA-prevalence-incidence.zip"
      sha256: null
      requires_auth: false
      size_hint: "1.5GB"
    - name: "IHME-GBD_2021_DATA-codebook.zip"
      url: "https://ghdx.healthdata.org/sites/default/files/record-attached-files/IHME-GBD_2021_DATA-codebook.zip"
      sha256: null
      requires_auth: false
      size_hint: "5MB"

